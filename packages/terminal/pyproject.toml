[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apt-terminal"
version = "0.1.0"
description = "Python CLI for agenticregistry and my-agentic-storage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mike Fullerton", email = "mike@mikefullerton.com" }]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "attrs>=26.1",
    "rich>=13.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    # Pinned for the SAME reason the generator below is, and it took a 1,342-file diff to
    # notice: ruff is not merely this package's linter, it is the last stage of code
    # GENERATION. `openapi-python-client-config.yaml` runs `ruff check --fix` and
    # `ruff format .` as post-hooks, so the committed tree under
    # `src/apt_terminal/generated/` is ruff's output, not the generator's. A range let two
    # regenerations on two machines disagree about it: 0.13.3 kept a blank line after a
    # function signature that an earlier ruff removed, and rewrote 900-odd `None | str`
    # unions to `str | None`. Nothing about that is wrong — and none of it is reviewable
    # either, because it buries the handful of lines a route change actually produced.
    #
    # Bump it deliberately and regenerate in the same commit, exactly as for the generator.
    # `--exit-zero` on the check hook stays regardless: it defends against a new ruff RULE
    # failing generation, which is a different failure from this one.
    "ruff==0.13.3",
    "mypy>=1.10",
    # Pinned (like the swift generator's --branch pin) so `pnpm gen` is reproducible:
    # an unpinned range reformats the whole generated tree whenever the installed
    # version drifts. Bump deliberately + regenerate.
    "openapi-python-client==0.26.2",
]

[project.scripts]
apt = "apt_terminal.cli:_run"

[tool.hatch.build.targets.wheel]
packages = ["src/apt_terminal"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The generated openapi-python-client code is machine-emitted and not
# lint-clean; exclude it (mirrors the mypy override below).
extend-exclude = ["src/apt_terminal/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/apt_terminal"]

[[tool.mypy.overrides]]
module = "apt_terminal.generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
