# ADT is consumed as a submodule by more than one host repo, so its suites run AT
# THE SOURCE on every push and PR — not only inside a consumer's CI at whatever
# pinned SHA that consumer happens to hold.
name: web-tests

on:
  push:
    # open-source-etc is included because every phase of this migration lands
    # directly on that branch with no PR open; with [main] alone this workflow
    # would never fire until the branch merges, and Tasks 4-11 need the gate to
    # exist before then. Remove the open-source-etc entry when this branch merges.
    branches: [main, open-source-etc]
    paths:
      - "packages/web/**"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "packages/web/**"
      - ".github/workflows/web-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure-Python, no toolchain — run before install so a licence regression
      # fails in seconds rather than after the whole workspace builds. Self-test
      # first: a guard whose failing case has rotted passes vacuously.
      - name: licence fields are Apache-2.0
        run: |
          python3 packages/web/tools/check_license_fields_test.py
          python3 packages/web/tools/check_license_fields.py

      # Eight packages are arriving here from a PRIVATE repo, each carrying the
      # prose its old home wrote about it. The per-package arrival checks scan
      # src/, which is where the imports are — and imports are not where this
      # leaks. It leaks in a README, a CHANGELOG, a comment in a config file:
      # the files nobody greps because they do not compile.
      - name: no private package references
        run: |
          python3 tools/check_no_private_scope_test.py
          python3 tools/check_no_private_scope.py

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: packages/web

      # Both, because neither alone covers the workspace. The root `pnpm test` is
      # one vitest run configured with `dir: './packages'`, so it DISCOVERS every
      # package's tests including the ones that declare no test script of their
      # own — today that is seven of nine, among them `chat`. It is also the
      # command CONTRIBUTING.md tells contributors to run, and a public repo
      # whose documented test command is not the one CI runs is telling two
      # different stories about what passing means.
      #
      # The recursive run covers the opposite gap: a package that declares a
      # test script runs under ITS OWN config, which is the config its consumers
      # build against, and which can differ from the root's (extra setup files,
      # a different environment). That only holds because every such package
      # carries a vitest.config.ts — vitest walks up to the root config but keeps
      # cwd as its root, so the root's `dir: './packages'` would resolve to
      # <package>/packages and silently match nothing. A package that declares
      # `test` without its own config runs zero tests and exits 0.
      - run: pnpm test
        working-directory: packages/web

      - run: pnpm -r --if-present run test
        working-directory: packages/web
